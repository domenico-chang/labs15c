name: React CI/CD Pipeline with software testing and DevSecOps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Audit npm dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

  secret-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code and full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$release_url/$archive" --output "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location "$release_url/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output "$RUNNER_TEMP/checksums.txt"
          cd "$RUNNER_TEMP"
          grep -F "  $archive" checksums.txt | sha256sum --check
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan repository history for secrets
        run: gitleaks git --redact --exit-code 1 .

  build:
    name: Build
    needs: [dependency-audit, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

  tests:
    name: Run unit tests
    needs: build
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  deploy:
    name: Deploy
    needs: [tests, dependency-audit, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      vercel_url: ${{ steps.deploy-vercel.outputs.vercel_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Deploy to Vercel
        id: deploy-vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Error: falta el secreto VERCEL_TOKEN"
            exit 1
          fi
          URL="$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" | tail -n 1)"
          if [[ "$URL" != https://* ]]; then
            echo "Error: Vercel no devolvió una URL válida: $URL"
            exit 1
          fi
          echo "vercel_url=$URL" >> "$GITHUB_OUTPUT"

  cypress-e2e:
    name: Cypress E2E Tests
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cypress repo
        uses: actions/checkout@v7
        with:
          repository: domenico-chang/cypress15c
          token: ${{ secrets.MI_GITHUB_TOKEN_REPOS || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Cypress dependencies
        run: npm install cypress --save-dev

      - name: Debug deployment URL
        env:
          APP_URL: ${{ needs.deploy.outputs.vercel_url }}
        run: echo "La URL recibida de Vercel es $APP_URL"

      - name: Run Cypress Tests
        uses: cypress-io/github-action@v7
        env:
          CYPRESS_BASE_URL: ${{ needs.deploy.outputs.vercel_url }}
          CYPRESS_SCREENSHOT_ON_RUN_FAILURE: 'true'
          CYPRESS_VIDEO: 'false'
        with:
          install: false
          browser: chrome
          record: false
          publish-summary: true
